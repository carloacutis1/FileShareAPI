services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: database
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # main entry point
      - ./internal/database/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql
      # sample data (disabled until seed files include password_hash)
      #- ./internal/database/seed-data/01-user.sql:/docker-entrypoint-initdb.d/01-user.sql
      #- ./internal/database/seed-data/02-folder.sql:/docker-entrypoint-initdb.d/02-folder.sql
      #- ./internal/database/seed-data/03-file.sql:/docker-entrypoint-initdb.d/03-file.sql
      #- ./internal/database/seed-data/04-shared_file.sql:/docker-entrypoint-initdb.d/04-shared_file.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/database?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
