# CI pipeline: mirrors .gitlab-ci.yml (validate, build, test)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # validate: make sure all dependencies download and verify
      - name: Validate dependencies
        run: |
          go mod download
          go mod verify

      # build: compile the API binary
      - name: Build
        run: go build -o basement ./cmd/api/main.go

      # format: fail if any file is not gofmt-formatted
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      # lint: check for common bugs and style issues
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      # test: run all unit tests with coverage
      - name: Test
        run: go test -v ./... -coverprofile=coverage.out
