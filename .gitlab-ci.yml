# CI/CD Pipeline for automation
# We will need to edit this pipeline as we code.

stages:
  # each stage will run to make sure our whole codebase works for each merge request
  - validate
  - build
  - lint
  - test

validate_stage:
  # validate stage will make sure all dependencies are installed
  stage: validate
  image: golang:1.25
  script:
    - go mod download
    - go mod verify

build_stage:
  # build stage will compile the go code into binary
  # will checks for basic syntax errors
  stage: build
  image: golang:1.25-alpine
  script:
    # builds an executable of our whole source code
    # running this command locally will build the file
    # you can test it and then run `./basement` to test our app
    - go build -o basement ./cmd/api/main.go
  artifacts:
    paths:
      - basement
    expire_in: 1 day

lint_stage:
  stage: lint
  image: golangci/golangci-lint:v2.9.0
  script:
    - golangci-lint run ./...
